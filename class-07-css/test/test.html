<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Mask Image</title>

    <style>
      body {
        background: #111827;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
      }

      .card {
        width: 350px;
        margin: 30px auto;
        background: #111827;
      }

      .card img {
        display: block;
        width: 100%;
        height: 350px;
        object-fit: cover;

        -webkit-mask-image: linear-gradient(
          to bottom,
          black 0%,
          black 25%,
          rgba(0, 0, 0, 0.1) 50%,
          transparent 100%
        );

        mask-image: linear-gradient(
          to bottom,
          black 0%,
          black 25%,
          rgba(0, 0, 0, 0.1) 50%,
          transparent 100%
        );
      }
    </style>
  </head>

  <body>
    <h1>CSS Mask Image</h1>

    <div class="card">
      <img
        src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600"
        alt="Landscape"
      />
    </div>
  </body>
</html>
