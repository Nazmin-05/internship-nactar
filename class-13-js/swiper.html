
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Swiper Slider</title>

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css">

    <style>

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #eaf6ff;
        }

        h1 {
            text-align: center;
            color: #0077b6;
            margin-top: 30px;
        }

        .swiper {
            width: 85%;
            height: 450px;
            margin-top: 40px;
            border-radius: 10px;
        }

        .swiper-slide {
            text-align: center;
            font-size: 30px;
            background: #90e0ef;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
        }

        .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .swiper-pagination-bullet {
            width: 25px;
            height: 25px;
            line-height: 25px;
            text-align: center;
            font-size: 12px;
            color: white;
            opacity: 1;
            background: #0077b6;
        }

        .swiper-pagination-bullet-active {
            background: #ff6b6b;
        }

    </style>
</head>

<body>

    <h1>My Image Slider</h1>

    <!-- Swiper -->

    <div class="swiper mySwiper">

        <div class="swiper-wrapper">

            <div class="swiper-slide">
                <img src="https://picsum.photos/id/1015/1000/600">
            </div>

            <div class="swiper-slide">
                <img src="https://picsum.photos/id/1018/1000/600">
            </div>

            <div class="swiper-slide">
                <img src="https://picsum.photos/id/1019/1000/600">
            </div>

            <div class="swiper-slide">
                <img src="https://picsum.photos/id/1020/1000/600">
            </div>

        </div>

        <!-- Pagination -->
        <div class="swiper-pagination"></div>

        <!-- Navigation -->
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>

    </div>


    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>

    <script>

        var swiper = new Swiper(".mySwiper", {

            loop: true,

            pagination: {
                el: ".swiper-pagination",
                clickable: true,

                renderBullet: function (index, className) {
                    return '<span class="' + className + '">' +
                    (index + 1) + '</span>';
                },
            },

            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },

        });

    </script>

</body>
</html>
