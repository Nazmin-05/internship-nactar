<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discount counter</title>
  </head>
  <body>
    <script>
      const price = 8000;
      const discount_percentage = 0.1;
      const discounted_price = price * discount_percentage;
      let payable_price = price - discounted_price;
      document.write("Orginal Price: ", price);
      document.write("<br>Discount: 10% ");
      document.write("<br>Dicount amount: ", discounted_price);
      document.write("<br>Discounted price: ", payable_price);
    </script>
  </body>
</html>
